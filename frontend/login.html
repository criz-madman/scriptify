<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptify — Sign In with Email OTP</title>
  <link rel="icon" type="image/png" href="myimages/scriptfy%20icon.png">
  <link rel="apple-touch-icon" href="myimages/scriptfy%20icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ae: {
              darkest: '#070503',
              panel: '#100b06',
              surface: '#181008',
              border: 'rgba(245, 158, 11, 0.2)',
              accent: '#f97316',
              amber: '#f59e0b'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#070503] text-zinc-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

  <!-- Top Light Beam -->
  <div class="light-beam-glow"></div>

  <!-- Main Login Card -->
  <div class="w-full max-w-md glass-card rounded-3xl p-8 sm:p-10 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.9),0_0_50px_-10px_rgba(249,115,22,0.2)] relative z-10">
    
    <!-- Brand Header with Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center justify-center mb-3 group">
        <img src="/images/logo.png" alt="Scriptify" class="h-10 sm:h-11 w-auto object-contain transition-opacity group-hover:opacity-85">
      </a>
      <h1 class="text-sm font-bold uppercase tracking-wider text-amber-400 font-mono mt-1">Passwordless Studio Sign In</h1>
      <p class="text-xs text-zinc-400 mt-1">We'll dispatch a 6-digit one-time code to your email</p>
    </div>

    <!-- Step 1: Request OTP -->
    <div id="login-step-email" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Email Address
        </label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-zinc-500 text-xs"></i>
          <input 
            type="email" 
            id="login-email-input" 
            placeholder="motion.designer@studio.com" 
            class="w-full bg-[#140e07] border border-amber-500/25 rounded-xl pl-10 pr-4 py-3 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-orange-500 transition-colors font-medium shadow-inner"
          >
        </div>
      </div>

      <button 
        id="btn-login-send-otp" 
        class="btn-amber-pill w-full py-3.5 text-white font-bold text-xs uppercase tracking-wider flex items-center justify-center space-x-2"
      >
        <span>Send Verification Code</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>

      <div class="text-center pt-2">
        <a href="/" class="text-xs text-zinc-400 hover:text-amber-300 transition-colors flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-arrow-left text-[10px]"></i>
          <span>Back to Home</span>
        </a>
      </div>
    </div>

    <!-- Step 2: Verify OTP -->
    <div id="login-step-otp" class="hidden space-y-5">
      <div class="text-center">
        <p class="text-xs text-zinc-300">Enter the 6-digit verification code sent to:</p>
        <p id="login-target-email" class="text-xs font-bold text-amber-400 font-mono mt-0.5"></p>
      </div>

      <!-- Dev mode helper notice -->
      <div id="login-dev-notice" class="hidden p-3 bg-orange-950/40 border border-orange-500/40 rounded-xl text-center">
        <span class="text-[11px] text-amber-300 block font-medium">Dev Auto-Detected OTP Code:</span>
        <span id="login-dev-code" class="font-mono text-xl font-black text-amber-400 tracking-widest cursor-pointer hover:underline" title="Click to insert"></span>
      </div>

      <div>
        <input 
          type="text" 
          id="login-otp-input" 
          maxlength="6" 
          placeholder="000000" 
          class="w-full bg-[#140e07] border border-amber-500/30 rounded-xl py-3.5 text-center text-2xl font-mono tracking-widest text-zinc-100 focus:outline-none focus:border-orange-500 transition-colors shadow-inner"
        >
      </div>

      <button 
        id="btn-login-verify-otp" 
        class="btn-amber-pill w-full py-3.5 text-white font-bold text-xs uppercase tracking-wider flex items-center justify-center space-x-2"
      >
        <span>Verify & Enter Studio</span>
        <i class="fa-solid fa-check text-xs"></i>
      </button>

      <div class="text-center pt-1">
        <button id="btn-login-change-email" class="text-xs text-zinc-400 hover:text-amber-300 transition-colors">
          &larr; Change email address
        </button>
      </div>
    </div>

    <div id="login-error-text" class="text-xs text-rose-400 text-center mt-4 font-medium"></div>

  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (API.isAuthenticated()) {
        window.location.href = '/dashboard.html';
        return;
      }

      let pendingEmail = '';
      const stepEmail = document.getElementById('login-step-email');
      const stepOtp = document.getElementById('login-step-otp');
      const emailInput = document.getElementById('login-email-input');
      const otpInput = document.getElementById('login-otp-input');
      const btnSend = document.getElementById('btn-login-send-otp');
      const btnVerify = document.getElementById('btn-login-verify-otp');
      const btnChange = document.getElementById('btn-login-change-email');
      const devNotice = document.getElementById('login-dev-notice');
      const devCode = document.getElementById('login-dev-code');
      const errorText = document.getElementById('login-error-text');
      const targetEmailText = document.getElementById('login-target-email');

      const showError = (msg) => { errorText.textContent = msg; };

      btnSend.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email || !email.includes('@')) {
          showError('Please enter a valid email address.');
          return;
        }

        try {
          btnSend.disabled = true;
          btnSend.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Sending Code...`;
          errorText.textContent = '';

          const data = await API.post('/api/auth/send-otp', { email });
          pendingEmail = email;

          if (data.devOtp) {
            devCode.textContent = data.devOtp;
            devNotice.classList.remove('hidden');
            otpInput.value = data.devOtp;
          }

          targetEmailText.textContent = email;
          stepEmail.classList.add('hidden');
          stepOtp.classList.remove('hidden');
          otpInput.focus();
        } catch (err) {
          showError(err.message || 'Failed to dispatch verification code.');
        } finally {
          btnSend.disabled = false;
          btnSend.innerHTML = `<span>Send Verification Code</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
      });

      btnVerify.addEventListener('click', async () => {
        const otp = otpInput.value.trim();
        if (!otp || otp.length < 6) {
          showError('Please enter the 6-digit verification code.');
          return;
        }

        try {
          btnVerify.disabled = true;
          btnVerify.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying...`;
          errorText.textContent = '';

          const data = await API.post('/api/auth/verify-otp', { email: pendingEmail, otp });
          API.setToken(data.token);

          window.location.href = '/dashboard.html';
        } catch (err) {
          showError(err.message || 'Verification failed. Please try again.');
        } finally {
          btnVerify.disabled = false;
          btnVerify.innerHTML = `<span>Verify & Enter Studio</span> <i class="fa-solid fa-check text-xs"></i>`;
        }
      });

      if (btnChange) {
        btnChange.addEventListener('click', () => {
          stepOtp.classList.add('hidden');
          stepEmail.classList.remove('hidden');
          errorText.textContent = '';
        });
      }

      if (emailInput) {
        emailInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') btnSend.click();
        });
      }

      if (otpInput) {
        otpInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') btnVerify.click();
        });
      }
    });
  </script>
</body>
</html>
