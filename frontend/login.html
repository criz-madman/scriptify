<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptify — Sign In with Email OTP</title>
  <link rel="icon" type="image/png" href="myimages/scriptfy%20icon.png">
  <link rel="apple-touch-icon" href="myimages/scriptfy%20icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ae: {
              darkest: '#070503',
              panel: '#100b06',
              surface: '#181008',
              border: 'rgba(245, 158, 11, 0.2)',
              accent: '#f97316',
              amber: '#f59e0b'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Firebase Authentication & Analytics -->
  <script type="module" src="js/firebaseConfig.js"></script>
</head>
<body class="bg-[#070503] text-zinc-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden">

  <!-- Top Light Beam -->
  <div class="light-beam-glow"></div>

  <!-- Main Login Card -->
  <div class="w-full max-w-md glass-card rounded-3xl p-8 sm:p-10 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.9),0_0_50px_-10px_rgba(249,115,22,0.2)] relative z-10">
    
    <!-- Brand Header with Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center justify-center mb-3 group">
        <img src="/images/logo.png" alt="Scriptify" class="h-10 sm:h-11 w-auto object-contain transition-opacity group-hover:opacity-85">
      </a>
      <h1 class="text-sm font-bold uppercase tracking-wider text-amber-400 font-mono mt-1">Studio Sign In</h1>
      <p class="text-xs text-zinc-400 mt-1">Sign in with Google or one-time email code</p>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="space-y-4">
      <!-- Firebase Google Sign-In Button -->
      <button 
        type="button"
        id="btn-login-google" 
        class="w-full py-3.5 px-4 rounded-xl border border-amber-500/30 hover:border-amber-400/80 bg-[#140e07] hover:bg-[#1f150b] text-zinc-100 font-semibold text-xs transition-all duration-200 flex items-center justify-center space-x-3 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.5)] hover:shadow-[0_0_20px_rgba(249,115,22,0.2)] group cursor-pointer"
      >
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span class="tracking-wide">Continue with Google</span>
      </button>

      <!-- Divider -->
      <div class="relative my-3 flex items-center justify-center">
        <div class="border-t border-amber-500/15 w-full"></div>
        <span class="bg-[#100b06] px-3 text-[10px] font-mono text-zinc-400 uppercase tracking-widest relative z-10">or continue with email</span>
      </div>
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Email Address
        </label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-zinc-500 text-xs"></i>
          <input 
            type="email" 
            id="login-email-input" 
            placeholder="motion.designer@studio.com" 
            class="w-full bg-[#140e07] border border-amber-500/25 rounded-xl pl-10 pr-4 py-3 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-orange-500 transition-colors font-medium shadow-inner"
          >
        </div>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Password
        </label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-zinc-500 text-xs"></i>
          <input 
            type="password" 
            id="login-password-input" 
            placeholder="••••••••" 
            class="w-full bg-[#140e07] border border-amber-500/25 rounded-xl pl-10 pr-4 py-3 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-orange-500 transition-colors font-medium shadow-inner"
          >
        </div>
      </div>

      <button 
        id="btn-login-submit" 
        class="btn-amber-pill w-full py-3.5 text-white font-bold text-xs uppercase tracking-wider flex items-center justify-center space-x-2 mt-6 cursor-pointer"
      >
        <span>Sign In to Studio</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>

      <div class="text-center pt-2 space-y-3 mt-4">
        <p class="text-xs text-zinc-400">
          Don't have an account? <a href="/register" class="text-amber-500 hover:text-amber-400 font-bold underline decoration-amber-500/30 underline-offset-4 transition-colors">Sign up</a>
        </p>
        <a href="/" class="text-xs text-zinc-500 hover:text-amber-300 transition-colors flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-arrow-left text-[10px]"></i>
          <span>Back to Home</span>
        </a>
      </div>
    </div>

    <div id="login-error-text" class="text-xs text-rose-400 text-center mt-4 font-medium"></div>

  </div>

  <script src="js/api.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (API.isAuthenticated()) {
        window.location.href = '/explore';
        return;
      }

      const emailInput = document.getElementById('login-email-input');
      const passwordInput = document.getElementById('login-password-input');
      const btnSubmit = document.getElementById('btn-login-submit');
      const btnGoogle = document.getElementById('btn-login-google');
      const errorText = document.getElementById('login-error-text');

      const showError = (msg) => { errorText.textContent = msg; };

      // Waits for FirebaseBridge to be ready
      function waitForFirebase(timeoutMs = 10000) {
        if (window.FirebaseBridge) return Promise.resolve(window.FirebaseBridge);
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            window.removeEventListener('firebase:ready', handler);
            reject(new Error('Firebase took too long to initialize. Please refresh and try again.'));
          }, timeoutMs);
          function handler(e) {
            clearTimeout(timer);
            resolve(window.FirebaseBridge);
          }
          window.addEventListener('firebase:ready', handler, { once: true });
        });
      }

      const googleBtnHTML = btnGoogle ? btnGoogle.innerHTML : '';

      // Google Sign-In with Firebase
      if (btnGoogle) {
        btnGoogle.addEventListener('click', async () => {
          try {
            showError('');
            btnGoogle.disabled = true;
            btnGoogle.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Connecting...`;

            const bridge = await waitForFirebase();
            const { user, session } = await bridge.loginWithGoogle();
            if (user.email === 'christanjames07@gmail.com') {
              window.location.href = '/admin';
            } else {
              window.location.href = '/explore';
            }
          } catch (err) {
            console.error(err);
            if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
              // ignore
            } else {
              showError(err.message || 'Failed to sign in with Google.');
            }
          } finally {
            btnGoogle.disabled = false;
            btnGoogle.innerHTML = googleBtnHTML;
          }
        });
      }

      // Email & Password Sign-In
      btnSubmit.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !email.includes('@')) {
          showError('Please enter a valid email address.');
          return;
        }
        if (!password) {
          showError('Please enter your password.');
          return;
        }

        try {
          btnSubmit.disabled = true;
          btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Signing In...`;
          showError('');

          const bridge = await waitForFirebase();
          const { user, session } = await bridge.loginWithEmail(email, password);

          if (user.email === 'christanjames07@gmail.com') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/explore';
          }
        } catch (err) {
          console.error(err);
          // Standardize error messages
          if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
            showError('Invalid email or password.');
          } else {
            showError(err.message || 'Failed to sign in. Please try again.');
          }
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Sign In to Studio</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
      });

      if (emailInput && passwordInput) {
        const triggerSubmit = (e) => { if (e.key === 'Enter') btnSubmit.click(); };
        emailInput.addEventListener('keydown', triggerSubmit);
        passwordInput.addEventListener('keydown', triggerSubmit);
      }
    });
  </script>
</body>
</html>
