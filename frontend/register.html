<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriptify — Create Account</title>
  <link rel="icon" type="image/png" href="myimages/scriptfy icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ae: {
              darkest: '#070503',
              panel: '#100b06',
              surface: '#181008',
              border: 'rgba(245, 158, 11, 0.2)',
              accent: '#f97316',
              amber: '#f59e0b'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/firebaseConfig.js"></script>
</head>
<body class="bg-[#070503] text-zinc-100 min-h-screen flex flex-col justify-center items-center p-4 relative overflow-hidden font-sans">

  <!-- Top Light Beam -->
  <div class="light-beam-glow"></div>

  <!-- Main Register Card -->
  <div class="w-full max-w-md glass-card rounded-3xl p-8 sm:p-10 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.9),0_0_50px_-10px_rgba(249,115,22,0.2)] relative z-10">
    
    <!-- Brand Header with Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center justify-center mb-3 group">
        <img src="/images/logo.png" alt="Scriptify" class="h-10 sm:h-11 w-auto object-contain transition-opacity group-hover:opacity-85" onerror="this.src='myimages/scriptfy icon.png'">
      </a>
      <h1 class="text-sm font-bold uppercase tracking-wider text-amber-400 font-mono mt-1">Create Account</h1>
      <p class="text-xs text-zinc-400 mt-1">Join the ultimate preset studio</p>
    </div>

    <!-- Registration Form -->
    <div id="register-form" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Email Address
        </label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-zinc-500 text-xs"></i>
          <input 
            type="email" 
            id="register-email-input" 
            placeholder="motion.designer@studio.com" 
            class="w-full bg-[#140e07] border border-amber-500/25 rounded-xl pl-10 pr-4 py-3 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-orange-500 transition-colors font-medium shadow-inner"
          >
        </div>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Password
        </label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-zinc-500 text-xs"></i>
          <input 
            type="password" 
            id="register-password-input" 
            placeholder="••••••••" 
            class="w-full bg-[#140e07] border border-amber-500/25 rounded-xl pl-10 pr-4 py-3 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-orange-500 transition-colors font-medium shadow-inner"
          >
        </div>
      </div>

      <div class="mt-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Confirm Password
        </label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-zinc-500 text-xs"></i>
          <input 
            type="password" 
            id="register-confirm-input" 
            placeholder="••••••••" 
            class="w-full bg-[#140e07] border border-amber-500/25 rounded-xl pl-10 pr-4 py-3 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-orange-500 transition-colors font-medium shadow-inner"
          >
        </div>
      </div>

      <button 
        id="btn-register-submit" 
        class="btn-amber-pill w-full py-3.5 text-white font-bold text-xs uppercase tracking-wider flex items-center justify-center space-x-2 mt-6 cursor-pointer"
      >
        <span>Sign Up</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>

      <div class="text-center pt-2 space-y-3 mt-4">
        <p class="text-xs text-zinc-400">
          Already have an account? <a href="/login" class="text-amber-500 hover:text-amber-400 font-bold underline decoration-amber-500/30 underline-offset-4 transition-colors">Sign in</a>
        </p>
      </div>
    </div>

    <div id="register-error-text" class="text-xs text-rose-400 text-center mt-4 font-medium"></div>

  </div>

  <script src="js/api.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (API && API.isAuthenticated()) {
        window.location.href = '/explore';
        return;
      }

      const emailInput = document.getElementById('register-email-input');
      const passwordInput = document.getElementById('register-password-input');
      const confirmInput = document.getElementById('register-confirm-input');
      const btnSubmit = document.getElementById('btn-register-submit');
      const errorText = document.getElementById('register-error-text');

      const showError = (msg) => { errorText.textContent = msg; };

      function waitForFirebase(timeoutMs = 10000) {
        if (window.FirebaseBridge) return Promise.resolve(window.FirebaseBridge);
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            window.removeEventListener('firebase:ready', handler);
            reject(new Error('Firebase took too long to initialize. Please refresh.'));
          }, timeoutMs);
          function handler() {
            clearTimeout(timer);
            resolve(window.FirebaseBridge);
          }
          window.addEventListener('firebase:ready', handler, { once: true });
        });
      }

      btnSubmit.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (!email || !email.includes('@')) {
          showError('Please enter a valid email address.');
          return;
        }
        if (!password || password.length < 6) {
          showError('Password must be at least 6 characters.');
          return;
        }
        if (password !== confirm) {
          showError('Passwords do not match.');
          return;
        }

        try {
          btnSubmit.disabled = true;
          btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Creating Account...`;
          showError('');

          const bridge = await waitForFirebase();
          const { user, session } = await bridge.registerWithEmail(email, password);

          window.location.href = '/explore';
        } catch (err) {
          console.error(err);
          if (err.code === 'auth/email-already-in-use') {
            showError('An account with this email already exists.');
          } else {
            showError(err.message || 'Failed to register. Please try again.');
          }
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Sign Up</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
      });

      const triggerSubmit = (e) => { if (e.key === 'Enter') btnSubmit.click(); };
      if (emailInput) emailInput.addEventListener('keydown', triggerSubmit);
      if (passwordInput) passwordInput.addEventListener('keydown', triggerSubmit);
      if (confirmInput) confirmInput.addEventListener('keydown', triggerSubmit);
    });
  </script>
</body>
</html>
